# ==========================================================
# Wajeeha AI Core Configuration
# Non-secret configuration only.
# API Keys belong in .env
# ==========================================================

llm:
  default_provider: gemini

  providers:

    gemini:
      model: gemini-3.6-flash
      max_tokens: 4096
      temperature: 0.7

    openai:
      model: gpt-4o
      max_tokens: 4096

    anthropic:
      model: claude-sonnet-4-6
      max_tokens: 4096

    ollama:
      model: llama3.1
      base_url: http://localhost:11434

memory:

  short_term:
    max_turns: 40

  long_term:
    db_path: ./data/long_term.sqlite3

  semantic:
    chroma_path: ./data/chroma
    embedding_model: all-MiniLM-L6-v2
    collection_name: wajeeha_semantic

agents:

  coding:
    enabled: true

    workspace_root: ./workspace

    safe_shell_commands:
      - git status
      - git diff
      - git log
      - pytest
      - ls
      - cat

    require_confirmation_for_writes: true

  home:
    enabled: true

    home_assistant:
      base_url: http://homeassistant.local:8123

    default_room: living_room

planner:

  max_plan_steps: 12
  max_retries_per_step: 2
  reflect_after_each_step: true

logging:

  level: INFO
  log_dir: ./logs