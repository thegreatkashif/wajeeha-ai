# ==========================================================
# Wajeeha AI Core Configuration
# Non-secret configuration only.
# API Keys belong in .env
# ==========================================================

llm:
  # All inference runs on the laptop (i7-11th gen / 16GB). "ollama" stays
  # fully local and free; "openrouter" is the cloud fallback for tasks that
  # need a stronger model than what comfortably fits in 16GB of RAM.
  # Switch the active one per-request from code via LLMRouter.get("openrouter"),
  # or just flip default_provider here.
  default_provider: ollama

  providers:

    ollama:
      model: llama3.1
      base_url: http://localhost:11434

    openrouter:
      # Any model slug from https://openrouter.ai/models works here, e.g.
      # anthropic/claude-sonnet-4.6, openai/gpt-4o, google/gemini-3.6-flash,
      # meta-llama/llama-3.1-70b-instruct, deepseek/deepseek-v3, etc.
      model: anthropic/claude-sonnet-4.6
      max_tokens: 4096

    # Direct provider SDKs — kept as options, but openrouter covers all of
    # these through one key if you'd rather not manage separate accounts.
    gemini:
      model: gemini-3.6-flash
      max_tokens: 4096
      temperature: 0.7

    openai:
      model: gpt-4o
      max_tokens: 4096

    anthropic:
      model: claude-sonnet-4-6
      max_tokens: 4096

memory:

  short_term:
    max_turns: 40

  long_term:
    db_path: ./data/long_term.sqlite3

  semantic:
    chroma_path: ./data/chroma
    embedding_model: all-MiniLM-L6-v2
    collection_name: wajeeha_semantic

agents:

  coding:
    enabled: true

    workspace_root: ./workspace

    safe_shell_commands:
      - git status
      - git diff
      - git log
      - pytest
      - ls
      - cat

    require_confirmation_for_writes: true

  home:
    enabled: true

    home_assistant:
      # Home Assistant runs on the home server (Celeron/4GB). Reach it over
      # Tailscale rather than the LAN hostname, so this still works when
      # you're out of the house too. Replace with the MagicDNS name shown
      # by `tailscale status` on the server, e.g. home-server.tailnet.ts.net
      base_url: http://home-server:8123

    default_room: living_room

    mqtt:
      # Mosquitto also runs on the home server, for anything talking MQTT
      # directly instead of going through the HA REST API.
      host: home-server
      port: 1883
      username: wajeeha

voice:
  enabled: false          # flip to true once you've dropped reference clips in voice_samples/
  reference_samples_dir: ./voice_samples
  model: xtts_v2          # Coqui XTTS-v2 — open-weight, runs on CPU, good clone quality from ~30-60s of audio
  language: en
  output_dir: ./data/voice_out

planner:

  max_plan_steps: 12
  max_retries_per_step: 2
  reflect_after_each_step: true

logging:

  level: INFO
  log_dir: ./logs